<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DFIR // Kill Chain — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0A0B0D;
    --bg-panel:#14161A;
    --bg-panel-raised:#1B1E24;
    --border-hair:#262A31;
    --text-primary:#E7E9EC;
    --text-dim:#8B92A0;
    --accent-signal:#3DDC97;
    --sev-critical:#E5484D;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg-void); color:var(--text-primary); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:360px; background:var(--bg-panel);
    border:1px solid var(--border-hair); border-radius:8px; padding:32px 28px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .brand h1{ font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:0.5px; margin:0; }
  .brand h1 .slash{ color:var(--accent-signal); }
  .sub{ color:var(--text-dim); font-size:12.5px; margin:0 0 24px; }

  .tabs{ display:flex; gap:4px; margin-bottom:20px; background:var(--bg-void); border-radius:6px; padding:3px; }
  .tab{
    flex:1; text-align:center; padding:7px 0; border-radius:4px; cursor:pointer;
    font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim);
  }
  .tab.active{ background:var(--bg-panel-raised); color:var(--text-primary); }

  label{
    display:block; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--text-dim); margin-bottom:6px;
  }
  .field{ margin-bottom:16px; }
  input{
    width:100%; padding:10px 12px; background:var(--bg-void); border:1px solid var(--border-hair);
    border-radius:5px; color:var(--text-primary); font-family:var(--sans); font-size:14px;
  }
  input:focus{ outline:none; border-color:var(--accent-signal); }

  button{
    width:100%; padding:12px; margin-top:6px; background:var(--accent-signal); color:#08110D;
    border:none; border-radius:5px; font-family:var(--mono); font-weight:700; font-size:12.5px;
    text-transform:uppercase; letter-spacing:0.5px; cursor:pointer;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:wait; }

  .error-box{
    border:1px solid var(--sev-critical); background:rgba(229,72,77,0.08); border-radius:5px;
    padding:10px 12px; font-family:var(--mono); font-size:11.5px; color:#f2a3a5; margin-bottom:16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><h1>DFIR<span class="slash">//</span>KILL CHAIN</h1></div>
    <p class="sub">local analysis · local llm</p>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="setMode('login')">Sign in</div>
      <div class="tab" id="tab-register" onclick="setMode('register')">Register</div>
    </div>

    <div id="error-slot"></div>

    <form id="auth-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required minlength="3">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required minlength="8">
      </div>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

<script>
let mode = "login";

function setMode(next) {
  mode = next;
  document.getElementById("tab-login").classList.toggle("active", mode === "login");
  document.getElementById("tab-register").classList.toggle("active", mode === "register");
  document.getElementById("submit-btn").textContent = mode === "login" ? "Sign in" : "Create account";
  document.getElementById("password").autocomplete = mode === "login" ? "current-password" : "new-password";
  document.getElementById("error-slot").innerHTML = "";
}

document.getElementById("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const errorSlot = document.getElementById("error-slot");
  errorSlot.innerHTML = "";
  btn.disabled = true;

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch(`/api/auth/${mode === "login" ? "login" : "register"}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errorSlot.innerHTML = `<div class="error-box">${escapeHtml(body.detail || "Something went wrong.")}</div>`;
      btn.disabled = false;
      return;
    }

    window.location.href = "/";
  } catch (err) {
    errorSlot.innerHTML = `<div class="error-box">Could not reach the server.</div>`;
    btn.disabled = false;
  }
});

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}
</script>
</body>
</html>
